<style>
:root {
  --bg: #f6f7f4; --surface: #ffffff; --surface-2: #eef1ec; --text: #1d2420; --muted: #5d6a62;
  --line: #d8ded8; --accent: #2f6b45; --accent-soft: #e2efe6; --good: #2f7a4a; --good-soft: #e3f3e8;

  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1c221f; --surface-2: #232b27; --text: #e6ebe7; --muted: #9aa69f;
    --line: #333d38; --accent: #7cc49a; --accent-soft: #233a2d; --good: #7cc49a; --good-soft: #1f3528;
    --bad: #e58a84; --bad-soft: #3a2422; --warn: #e2b95c; --warn-soft: #3a3020;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c221f; --surface-2: #232b27; --text: #e6ebe7; --muted: #9aa69f;
  --line: #333d38; --accent: #7cc49a; --accent-soft: #233a2d; --good: #7cc49a; --good-soft: #1f3528;
  --bad: #e58a84; --bad-soft: #3a2422; --warn: #e2b95c; --warn-soft: #3a3020;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line);

label.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
label.chip input { accent-color: var(--accent); margin: 0; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); padding: 8px 16px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; }
.muted { color: var(--muted); font-size: .9rem; }
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 0; margin-bottom: 16px; }
.topbar .inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
.timer.low { color: var(--bad); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { padding: 6px 12px; font-size: .9rem; }
.tabs button.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.q { padding: 16px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }

.q .tag { font-size: .78rem; color: var(--muted); margin-left: 6px; font-weight: 400; }
.opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: .93rem; }
.omr { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 8px; }
.omr button { padding: 4px 0; font-size: .78rem; }
.omr button.done { background: var(--accent-soft); border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .85rem; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.big { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.hidden { display: none !important; }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); }
@media (max-width: 560px) { .omr { grid-template-columns: repeat(5, 1fr); } .big { font-size: 1.8rem; } }
</style>

<script>
const DATA = [{"code": "01", "name": "조림", "kind": "필수", "questions": [{"id": "조림-1", "subject": "조림", "num": 1, "part": 1, "stem": "「지속가능한 산림자원 관리지침」상 ha당 식재본수 기준이 나머지와 다른 수종은?", "options": ["소나무", "편백", "낙엽송", "상수리나무"], "answer": 2, "explain": "낙엽송·잣나무는 ha당 3,000본, 나머지는 5,000본", "ref": "모듈 p.29–30"}, {"id": "조림-2", "subject": "조림", "num": 2, "part": 1, "stem": "조림지 활착률 조사 결과가 65%로 나왔다. 알맞은 조치는?", "options": ["조치 불필요", "보식", "재조림", "풀베기 생략"], "answer": 1, "explain": "80% 미만 보식, 50% 미만 재조림 → 65%는 보식", "ref": "p.33"}, {"id": "조림-3", "subject": "조림", "num": 3, "part": 1, "stem": "사업지 면적 1ha 이상인 조림지의 활착률 조사 표준지 크기로 옳은 것은?", "options": ["100㎡ (반지름 5.67m 원)", "200㎡ (반지름 8.0m 원)", "400㎡ (20m × 20m)", "50㎡ (반지름 4.0m 원)"], "answer": 1, "explain": "200㎡(반지름 8.0m). 1ha 미만이면 100㎡(5.67m) 가능", "ref": "p.149 붙임2"}, {"id": "조림-4", "subject": "조림", "num": 4, "part": 1, "stem": "온대중부 지역의 봄철 식재 적기는?", "options": ["2월 하순 ~ 3월 하순", "3월 상순 ~ 4월 상순", "3월 중순 ~ 4월 중순", "3월 하순 ~ 4월 하순"], "answer": 2, "explain": "난대 2하~3하, 온대남부 3상~4상, 온대중부 3중~4중, 온대북부 3하~4하", "ref": "p.29"}, {"id": "조림-5", "subject": "조림", "num": 5, "part": 1, "stem": "같은 지역에서 표고가 300m 높은 조림지의 침엽수 봄 식재 적기는 어떻게 되는가?", "options": ["약 5일 빨라진다", "약 5일 늦어진다", "약 15일 늦어진다", "약 15일 빨라진다"], "answer": 2, "explain": "표고 100m마다 약 5일 늦어짐 → 300m면 약 15일", "ref": "p.30"}, {"id": "조림-6", "subject": "조림", "num": 6, "part": 1, "stem": "산벌작업의 벌채 순서로 옳은 것은?", "options": ["예비벌 → 하종벌 → 후벌", "하종벌 → 예비벌 → 후벌", "후벌 → 하종벌 → 예비벌", "예비벌 → 후벌 → 하종벌"], "answer": 0, "explain": "산벌 = 예비벌 → 하종벌 → 후벌 (전갱작업)", "ref": "p.34–36"}, {"id": "조림-7", "subject": "조림", "num": 7, "part": 1, "stem": "참나무류 움싹갱신지에서 벌채 후 3년 안에 움싹이 ha당 몇 본 미만이면 조림하는가?", "options": ["900본", "1,600본", "3,000본", "5,000본"], "answer": 2, "explain": "3년 안에 움싹 ha당 3,000본 미만이면 조림", "ref": "p.38–40"}, {"id": "조림-8", "subject": "조림", "num": 8, "part": 1, "stem": "산림자원법상 벌채 후 조림하지 않아도 되는 경우가 **아닌** 것은?", "options": ["어린나무가 ha당 2만본 이상 고르게 자라는 경우", "참나무류 어린나무가 ha당 5천본 이상인 경우", "움싹이 왕성한 참나무류 그루터기가 ha당 900개 정도인 경우", "소나무 어린나무가 ha당 5천본 이상인 경우"], "answer": 3, "explain": "면제 기준은 어린나무 2만본, 참나무류 어린나무 5천본, 참나무 그루터기 900개", "ref": "법규 모듈 p.7"}, {"id": "조림-9", "subject": "조림", "num": 9, "part": 1, "stem": "풀베기에 대한 설명으로 옳지 **않은** 것은?", "options": ["조림 당년부터 5년차까지 실시한다", "줄베기 폭은 90~100cm로 한다", "둘레베기는 조림목 주위 반경 50cm를 벤다", "연 2회 실시할 때 2차 풀베기는 10월에 한다"], "answer": 3, "explain": "2회면 2차는 8월~9월 초순(최대 9월 중순)", "ref": "p.51–52"}, {"id": "조림-10", "subject": "조림", "num": 10, "part": 1, "stem": "덩굴제거 대상지 기준이 되는 덩굴 피복도는?", "options": ["30%", "50%", "70%", "80%"], "answer": 1, "explain": "피복도 50% 이상", "ref": "p.55"}, {"id": "조림-11", "subject": "조림", "num": 11, "part": 1, "stem": "어린나무가꾸기 대상지 기준으로 옳은 것은?", "options": ["조림 후 3~10년, 평균 흉고직경 1~4cm", "조림 후 10~20년, 평균 흉고직경 8~14cm", "조림 후 1~5년, 평균 흉고직경 2cm 미만", "조림 후 5~15년, 평균 흉고직경 2~8cm"], "answer": 3, "explain": "조림 후 5~15년, DBH 2~8cm", "ref": "p.64"}, {"id": "조림-12", "subject": "조림", "num": 12, "part": 1, "stem": "가지치기에 대한 설명으로 옳지 **않은** 것은?", "options": ["산 가지치기는 11월부터 이듬해 5월 이전에 한다", "지름 5cm 이상인 가지는 자르지 않는다", "침엽수는 절단면이 줄기와 평행하게 자른다", "목표생산재가 일반소경재(톱밥·펄프·숯)인 임분도 반드시 실시한다"], "answer": 3, "explain": "일반소경재가 목표면 가지치기 안 함", "ref": "p.69–70"}, {"id": "조림-13", "subject": "조림", "num": 13, "part": 1, "stem": "정량간벌·도태간벌을 적용할 수 있는 임분 조건은?", "options": ["우세목 평균수고 10m 이상이면서 15년생 이상", "우세목 평균수고 8m 이상이면서 10년생 이상", "평균 흉고직경 20cm 이상이면서 20년생 이상", "평균수고 15m 이상이면서 30년생 이상"], "answer": 0, "explain": "우세목 평균수고 10m 이상 + 15년생 이상", "ref": "p.72"}, {"id": "조림-14", "subject": "조림", "num": 14, "part": 1, "stem": "간벌 후 입목본수 기준표에서 낙엽송, 평균 흉고직경 16cm일 때 ha당 잔존본수는?", "options": ["760본", "900본", "940본", "1,100본"], "answer": 1, "explain": "낙엽송 16cm = 900본 (잣나무 760, 리기다 940, 소나무 강원 1,100)", "ref": "p.150 붙임3"}, {"id": "조림-15", "subject": "조림", "num": 15, "part": 1, "stem": "도태간벌에 대한 설명으로 옳지 **않은** 것은?", "options": ["미래목 사이는 최소 5m 이상 띄운다", "활엽수 미래목은 ha당 200본 내외로 고른다", "미래목은 가슴높이에 폭 10cm 적색 수성페인트로 표시한다", "하층의 보호목은 제거하지 않는다"], "answer": 2, "explain": "미래목 표시는 황색", "ref": "p.76–78"}, {"id": "조림-16", "subject": "조림", "num": 16, "part": 1, "stem": "공·사유림 기준벌기령으로 짝지은 것 중 옳지 **않은** 것은?", "options": ["소나무 – 40년", "잣나무 – 50년", "낙엽송 – 30년", "참나무류 – 40년"], "answer": 3, "explain": "참나무류는 공·사유림 25년(기업경영림 20년)", "ref": "p.151 붙임4"}, {"id": "조림-17", "subject": "조림", "num": 17, "part": 1, "stem": "「산림자원법 시행규칙」 [별표 3](모듈 붙임4)상 모두베기 1개 벌채구역의 최대 면적은?", "options": ["5만㎡", "10만㎡", "30만㎡", "50만㎡"], "answer": 2, "explain": "별표3 기준 최대 30만㎡, 5만㎡ 이상이면 20% 이상 존치. (지침 본문 p.90은 \"모두베기 대상지 최대 50ha 이내\"로 표현이 다르니 지문의 근거를 확인할 것)", "ref": "p.152"}, {"id": "조림-18", "subject": "조림", "num": 18, "part": 1, "stem": "골라베기(택벌)의 벌채 재적 한도는? (표고용 제외)", "options": ["20% 이내", "30% 이내", "40% 이내", "50% 이내"], "answer": 1, "explain": "30% 이내, 표고용은 50%", "ref": "p.152"}, {"id": "조림-19", "subject": "조림", "num": 19, "part": 1, "stem": "[전공서적 범위] 순량률 90%, 발아율 80%인 종자의 효율은?", "options": ["72%", "80%", "85%", "90%"], "answer": 0, "explain": "효율 = 순량률 × 발아율 = 0.9 × 0.8 = 72%", "ref": "산림기사 조림학"}, {"id": "조림-20", "subject": "조림", "num": 20, "part": 1, "stem": "목재생산림의 목표생산재 중 대경재의 가슴높이지름 기준은?", "options": ["20cm 이상", "30cm 이상", "36cm 이상", "40cm 이상"], "answer": 3, "explain": "대경재 40cm 이상, 중경재 20~40cm, 소경재 20cm 미만", "ref": "p.8–9"}, {"id": "조림-21", "subject": "조림", "num": 21, "part": 2, "stem": "수원함양림에서 솎아베기를 할 때 유지하는 수관울폐도의 원칙은?", "options": ["30~50%", "50~80%", "80~90%", "90% 이상"], "answer": 1, "explain": "수원함양림 솎아베기는 수관울폐도 50~80% 유지가 원칙", "ref": "모듈 p.12"}, {"id": "조림-22", "subject": "조림", "num": 22, "part": 2, "stem": "수원함양림의 덩굴제거에서 약제를 쓰지 않고 인력으로만 제거해야 하는 범위는? (하천·계곡 홍수위, 호소 만수위 등 수계 기준)", "options": ["30m 이내", "50m 이내", "100m 이내", "200m 이내"], "answer": 2, "explain": "수계로부터 100m 이내 또는 집수유역 안은 인력 제거", "ref": "p.11"}, {"id": "조림-23", "subject": "조림", "num": 23, "part": 2, "stem": "산지재해방지림 중 사방지 조림수종으로 권장되는 질소고정 수종이 **아닌** 것은?", "options": ["오리나무", "아까시나무", "싸리나무", "잣나무"], "answer": 3, "explain": "사방지는 오리나무·아까시나무·싸리나무 등 질소고정 수종 + 속성수 혼합", "ref": "p.13"}, {"id": "조림-24", "subject": "조림", "num": 2 ", "택벌회기가 짧을수록 1회 택벌률을 높여야 한다", "택벌회기가 길수록 1회 택벌률을 높일 수 있다", "택벌률은 법정축적과 무관하게 항상 80% 이상 적용한다"], "answer": 2, "explain": "택벌회기(간격)가 길면 그동안 자란 양이 많으므로 1회 벌채량(택벌률)을 높일 수 있음", "ref": "산림경영학"}, {"id": "조림-61", "subject": "조림", "num": 61, "part": 4, "stem": "파종상에서 묘목의 웃자람을 방지하고 잔뿌리 발달을 유도하기 위해 삽이나 전용 칼로 묘목의 주근(원뿌리)을 잘라주는 작업은?", "options": ["단근(Root pruning)", "상체", "가식", "경화"], "answer": 0, "explain": "단근(Root pruning)은 곧은뿌리를 잘라 잔뿌리 발달을 돕고 T/R율을 낮춤", "ref": "묘목육성학"}, {"id": "조림-62", "subject": "조림", "num": 62, "part": 4, "stem": "모수작업(Seed-tree method)에서 단위면적(1ha)당 잔존시켜야 할 모수(어미나무)의 표준 본수로 적절한 것은?", "options": ["1~2본", "15~30본", "100~200본", "500본 이상"], "answer": 1, "explain": "모수작업의 모수 본수는 통상 ha당 15~30본(전체 재적의 10% 내외)", "ref": "조림학본론"}, {"id": "조림-63", "subject": "조림", "num": 63, "part": 4, "stem": "온대 활엽수의 맹아갱신(왜림작업) 시 그루터기 벌채 높이로 가장 바람직한 것은?", "options": ["지상 50cm 이상", "지상 10~15cm 이하로 낮게", "지표면 아래 10cm", "높이는 무관함"], "answer": 1, "explain": "왜림 벌채 시 그루터기가 높으면 썩기 쉽고 싹이 부실하므로 10~15cm 이하로 낮게 비스듬히 자름", "ref": "육림학"}, {"id": "조림-64", "subject": "조림", "num": 64, "part": 4, "stem": "종자의 휴면 원인 중 배(Embryo) 자체가 미숙하여 후숙(After-ripening) 기간이 필요한 수종은?", "options": ["은행나무", "밤나무", "자작나무", "버드나무"], "answer": 0, "explain": "은행나무, 주목, 인삼 등은 낙과 시 배가 미숙 상태로 후숙 과정이 필요", "ref": "종자생리학"}, {"id": "조림-65", "subject": "조림", "num": 65, "part": 4, "stem": "침엽수 묘포장의 토양 조건으로 가장 알맞은 산도(pH) 범위는?", "options": ["pH 4.0 이하", "pH 5.0 ~ 6.0", "pH 7.0 ~ 7.5", "pH 8.0 이상"], "answer": 1, "explain": "침엽수는 약산성(pH 5.0~6.0), 활엽수는 약산성~중성(pH 5.5~6.5)이 최적", "ref": "산림토양학"}, {"id": "조림-66", "subject": "조림", "num": 66, "part": 4, "stem": "종자의 발아시험 시 발아율(Germination percentage)을 구하는 공식으로 옳은 것은?", "options": ["(발아한 종자수 ÷ 전체 치상 종자수) × 100", "(순정종자 무게 ÷ 전체 시료 무게) × 100", "(발아한 종자수 ÷ 순정종자 무게) × 100", "발아세 × 순량률 ÷ 100"], "answer": 0, "explain": "발아율 = (발아립수 ÷ 치상립수) × 100 · ②는 순량률", "ref": "종자검사규정"}, {"id": "조림-67", "subject": "조림", "num": 67, "part": 4, "stem": "수목의 광합성 속도에서 온도가 상승할 때 광합성량보다 호흡량이 급증하여 순광합성량이 0 이하로 떨어지는 주원인은? , "성충"], "answer": 1, "explain": "솔수염하늘소는 목질부 갱도 속에서 3~4령 노숙유충 상태로 월동 후 봄에 번데기가 됨", "ref": "산림곤충학"}, {"id": "산림보호-58", "subject": "산림보호", "num": 58, "part": 4, "stem": "남부 해안지대 곰솔림 등에 극심한 피해를 주며, 암수 형태가 전혀 다르고 겨울철에 수액을 흡즙하는 해충은?", "options": ["솔잎혹파리", "솔껍질깍지벌레", "솔알락명나방", "소나무좀"], "answer": 1, "explain": "솔껍질깍지벌레는 암컷 성충이 무시(날개 없음), 수컷은 유시 · 겨울~봄철 후식 피해 극심", "ref": "산림곤충학"}, {"id": "산림보호-59", "subject": "산림보호", "num": 59, "part": 4, "stem": "미국흰불나방의 생태적 특성으로 옳지 **않은** 것은?", "options": ["1년에 보통 2~3회 발생한다", "어린 유충 시기에는 거미줄을 치고 군서 생활을 한다", "번데기 상태로 수피 틈이나 낙엽 밑에서 월동한다", "침엽수 수종만 선택적으로 가해하는 식엽성 해충이다"], "answer": 3, "explain": "미국흰불나방은 광식성(활엽수 수백 종 가해) 식엽성 해충 (침엽수 전용 아님)", "ref": "산림곤충학"}, {"id": "산림보호-60", "subject": "산림보호", "num": 60, "part": 4, "stem": "버즘나무(플라타너스) 잎 뒷면에 기생하여 즙액을 빨아먹고 검은 배설물을 남겨 잎을 황백색으로 탈색시키는 해충은?", "options": ["버즘나무방패벌레", "매미나방", "오리나무잎벌레", "솔수염하늘소"], "answer": 0, "explain": "버즘나무방패벌레는 성충과 약충이 잎 뒷면에서 흡즙하여 백화 현상 유발", "ref": "산림해충학"}, {"id": "산림보호-61", "subject": "산림보호", "num": 61, "part": 4, "stem": "농약의 독성을 나타낼 때 시험동물의 50%를 치사시키는 데 필요한 체중 1kg당 약량(mg/kg)을 뜻하는 기호는?", "options": ["TLm", "LC50", "LD50", "EC50"], "answer": 2, "explain": "반수치사량은 LD50 (Lethal Dose 50%), 수치가 작을수록 독성이 강함", "ref": "농약학"}, {"id": "산림보호-62", "subject": "산림보호", "num": 62, "part": 4, "stem": "유기인계 살충제가 곤충의 신경계를 마비시켜 살충 작용을 나타내는 생화학적 기작은?", "options": ["아세틸콜린에스테라제(AChE) 활성 저해", "큐티클층 키틴 합성 억제", "미토콘드리아 전자전달계 차단", "세포벽 합성 효소 분해"], "answer": 0, "explain": "유기인계 및 카바메이트계는 신경전달물질 분해효소인 AChE를 저해하여 신경 마비 초래", "ref": "농약학"}, {"id": "산림보호-63", "subject": "산림보호", "num": 63, "part": 4, "stem": "월동기 수목의 응애류 및 병원균 방제를 위해 황분말과 생석회를 끓여 제조하는 알칼리성 살균·살충제는?", "options": ["석회보르도액", "석회황합제(석회유황합제)", "포르말린", "다이센 M-45"], "answer": 1, "explain": "석회황합제는 생석회+황분말을 1:2 비율로 끓여 조제하며 월동기 월동 병해충 방제에 탁월", "ref": "농약학"}, {"id": "산림보호-64", "subject": "산림보호", "num": 64, "part": 4, "stem": "산불 위험 예보 시 산림 내 마른 낙엽의 건조 상태를 나타내는 실효습도(Effective humidity)의 기준 중 산불 경보 발령 기준(매우 위험)에 해당하는 것은?", "options": ["실효습도 60% 이상", "실효습도 50%", "실효습도 40%", "실효습도 25% 이하"], "answer": 3, "explain": "실효습도 35% 이하 시 주의보, 25% 이하가 2일 이상 지속 시 산불경보 발령", "ref": "산불통계규정"}, {"id": "산림보호-65", "subject": "산림보호", "num": 65, "part": 4, "stem": "강풍을 동반한 대형 산불 시 솔방울이나 나뭇가지 등 불씨가 공중으로 치솟아 주 산불 전방 수백 미터 이상 날아가 새로운 불을 지르는 현상은?", "options": ["비화(Spotting fire)", "수관화", "지중화", "대류열 복사"], "answer": 0, "explain": "강풍에 의해 불씨가 원거리로 날아가는 현상을 비화(Spotting)라 하며 대형화의 주원인", "ref": "산불진화학"}, {"id": "산림보호-66", "subject": "산림보호", "num": 66, "part": 4, "stem": "겨울철 또는 초봄 낮 동안 햇볕을 받아 따뜻해진 줄기 남서쪽 수피가 밤에 급격히 냉각되면서 수축 팽창 차이로 줄기가 세로로 터져 갈라지는 현상은?", "options": ["동사", "만상", "상렬(Frost crack)", "한해"], "answer": 2, "explain": "상렬(Frost crack)은 낮과 밤의 급격한 온도차로 줄기 바깥쪽과 안쪽 수축 차에 의해 터짐", "ref": "수목생리학"}, {"id": "산림보호-67", "subject": "산림보호", "num": 67, "part": 4, "stem": "대기오염 물질인 아황산가스(SO₂)에 대한 수목의 내성 비교로 옳은 것은?", "options": ["은행나무는 침엽수보다 아황산가스에 매우 취약하다", "소나무, 잣나무 등 침엽수는 활엽수에 비해 일반적으로 감수성(피해)이 크다", "플라타너스는 공해에 가장 약한 대표 수종이다", "활엽수의 잎이 침엽수의 잎보다 기공 저항이 항상 낮다"], "answer": 1, "explain": "침엽수는 상록성으로 잎의 수명이 길어 만성적인 아황산가스 축적 피해에 훨씬 취약함", "ref": "환경수목학"}, {"id": "산림보호-68", "subject": "산림보호", "num": 68, "part": 4, "stem": "소나무재선충병 감염목의 훈증 방제 작업 시 밀폐용 타포린 비닐 피복재의 두께 기준으로 알맞은 것은?", "options": ["0.01mm 이상", "0.05mm 이상", "0.10mm 이상", "0.50mm 이상"], "answer": 2, "explain": "훈증용 타포린 비닐은 약제 가스 누출 방지를 위해 두께 0.1mm 이상 기준", "ref": "소나무재선충방제지침"}, {"id": "산림보호-69", "subject": "산림보호", "num": 69, "part": 4, "stem": "암컷 곤충이 수컷을 유인할 때 분비하는 성 페로몬(Sex pheromone)을 트랩에 넣어 해충을 유인 포살하는 방제법의 분류는?", "options": ["화학적 방제", "생물학적 방제(생물학적 제제 활용)", "기계적 방제", "임업적 방제"], "answer": 1, "explain": "페로몬 트랩은 곤충 고유의 화학물질을 모방한 생물적 방제 수단으로 분류", "ref": "해충방제학"}, {"id": "산림보호-70", "subject": "산림보호", "num": 70, "part": 4, "stem": "산림보호법상 산불예방을 위해 입산통제구역으로 지정·고시할 수 있는 권한권자는?", "options": ["관할 지방산림청장 또는 지방자치단체의 장", "소방청장", "국방부장관", "산림조합중앙회장"], "answer": 0, "explain": "산림보호법상 입산통제구역 지정 권한은 관할 지방산림청장 또는 지자체장(시장·군수·구청장)", "ref": "산림보호법"}, {"id": "산림보호-71", "subject": "산림보호", "num": 71, "part": 4, "stem": "최근 온난화로 인해 대발생하여 과수 및 산림 활엽수의 줄기에 집단으로 달라붙어 수액을 빨아먹고 그을음병을 유발하는 외래 돌발해충은?", "options": ["미국선녀벌레, 꽃매미", "솔잎혹파리", "밤나무혹벌", "솔껍질깍지벌레"], "answer": 0, "explain": "꽃매미와 미국선녀벌레는 2000년대 이후 정착한 대표 외래 흡즙성 돌발해충입니다.", "ref": "산림보호학 돌발해충"}, {"id": "산림보호-72", "subject": "산림보호", "num": 72, "part": 4, "stem": "소나무 줄기나 가지에 큰 혹(Gall)을 형성하며 봄철에 오렌지색 포자퇴를 터뜨리는 소나무 혹병(Cronartium quercuum)의 중간기주는?", "options": ["참나무류(신갈, 갈참 등)", "배나무", "향나무", "송이풀"], "answer": 0, "explain": "소나무 혹병균은 소나무 ↔ 참나무류 잎을 번갈아 가며 기주교대합니다.", "ref": "수목병리학"}, {"id": "산림보호-73", "subject": "산림보호", "num": 73, "part": 4, "stem": "잣나무 잎을 갉아먹는 해충으로, 유충이 실을 토해 여러 개의 잣나무 잎을 원통형으로 엮어 집을 짓고 그 속에서 가해하는 해충은?", "options": ["잣나무넓적잎벌", "솔나방", "솔알락명나방", "매미나방"], "answer": 0, "explain": "잣나무넓적잎벌 유충은 잎을 엮어 만든 방 속에 숨어 살며 잣나무 잎을 집단 식해합니다.", "ref": "산림해충학"}, {"id": "산림보호-74", "subject": "산림보호", "num": 74, "part": 4, "stem": "수목의 바이러스(Virus) 병해의 진단 및 전염 특성으로 옳지 **않은** 것은?", "options": ["즙액 접종, 접목, 진딧물이나 선충 매개에 의해 전염된다.", "일반 광학현미경으로 병원체를 쉽게 직접 관찰할 수 있다.", "잎에 모자이크 무늬, 얼룩 반점, 왜화(난쟁이화) 증상이 나타난다.", "살균제를 뿌려도 바이러스 자체를 직접 치료하기 어렵다."], "answer": 1, "explain": "바이러스는 크기가 수십~수백 nm로 매우 작아 전자현미경으로만 관찰 가능합니다.", "ref": "수목병리학"}, {"id": "산림보호-75", "subject": "산림보호", "num": 75, "part": 4, "stem": "산불 진화 전술에서 지표화가 수관화로 번지는 것을 막기 위해 수목을 벌채하고 낙엽을 긁어내어 불길을 차단하는 방화선(Fireline)의 표준 너비는?", "options": ["10cm 내외", "수관 높이의 1.5~2배 내외", "500m 이상", "폭은 관계없음"], "answer": 1, "explain": "방화선의 폭은 나무의 키(수고)에 비례하여 불길이 복사열이나 화염으로 건너뛰지 못하도록 수고의 1.5~2배 이상 확보합니다.", "ref": "산불방제학"}, {"id": "산림보호-76", "subject": "산림보호", "num": 76, "part": 4, "stem": "국내 농산물 및 임산물에 잔류허용기준이 설정되지 않은 농약이 검출되었을 때 일괄적으로 적용하는 불검출 기준(PLS 제도) 수치는?", "options": ["0.01 mg/kg(ppm) 이하", "0.1 mg/kg", "1.0 mg/kg", "5.0 mg/kg"], "answer": 0, "explain": "농약 허용기준 강화제도(PLS)상 등록되지 않은 농약은 0.01ppm 이하(사실상 불검출) 기준이 적용됩니다.", "ref": "농약안전사용기준"}, {"id": "산림보호-77", "subject": "산림보호", "num": 77, "part": 4, "stem": "소나무재선충병 예방을 위해 겨울철(1~2월)에 건전한 소나무의 줄기 기부에 구멍을 뚫고 주입하는 약제로 2년간 예방 효과가 지속되는 수간주사제는?", "options": ["아바멕틴(또는 에마멕틴벤조에이트) 유제", "석회황합제", "메탐소듐", "만코제브"], "answer": 0, "explain": "아바멕틴계 살충제는 나무 수액을 타고 전신에 퍼져 재선충이 침입해도 번식하지 못하게 막습니다.", "ref": "소나무재선충방제지침"}, {"id": "산림보호-78", "subject": "산림보호", "num": 78, "part": 4, "stem": "한겨울 수목이 영하의 저온에 노출될 때 일어나는 '세포 외 동결(Extracellular freezing)'에 대한 설명으로 옳은 것은?", "options": ["세포벽 바깥(세포간극)의 물이 먼저 얼면서 세포 내부의 수분을 끌어당겨 세포가 탈수된다.", "세포 내부의 원형질이 먼저 얼어 세포벽을 파괴한다.", "수목의 당분 함량이 낮을수록 동결을 잘 견딘다.", "세포 외 동결이 일어나면 수목은 100% 즉시 고사한다."], "answer": 0, "explain": "내한성이 강한 수목은 세포 밖에서 먼저 얼음이 얼게 유도하여 세포 내 수분을 밖으로 빼냄으로써 세포 원형질의 파괴를 방어합니다.", "ref": "수목생리학"}, {"id": "산림보호-79", "subject": "산림보호", "num": 79, "part": 4, "stem": "아까시나무 잎에 벌레혹을 만들어 잎을 누렇게 말라 떨어뜨리는 아까시잎혹파리의 월동 형태와 장소는?", "options": ["알 상태로 나뭇가지 끝", "유충 또는 번데기 상태로 땅속(토양)", "성충으로 수피 틈", "거미줄 속"], "answer": 1, "explain": "아까시잎혹파리는 가을에 땅으로 떨어져 흙 속에서 유충 또는 번데기로 겨울을 납니다.", "ref": "산림곤충학"}, {"id": "산림보호-80", "subject": "산림보호", "num": 80, "part": 4, "stem": "산림보호법상 산불을 발생하게 한 자가 부담해야 하는 법적 책임의 범위로 옳은 것은?", "options": ["형사처벌(징역·벌금)과 별도로 산림 피해에 대한 민사상 손해배상 책임도 함께 진다.", "형사처벌을 받으면 민사상 책임은 전액 면제된다.", "고의가 아닌 과실인 경우에는 아무런 법적 처벌을 받지 않는다.", "국유림 산불에 대해서는 국가가 전액 부담하므로 가해자 책임이 없다."], "answer": 0, "explain": "산불 실화자는 형사처벌(3년 이하 징역/3천만원 벌금)과 함께 진화 비용 및 입목 피해액에 대한 민사 배상 책임을 모두 집니다.", "ref": "산림보호법"}]}, {"code": "03", "name": "산림경영", "kind": "필수", "questions": [{"id": "산림경영-1", "subject": "산림경영", "num": 1, "part": 1, "stem": "산림경영의 최고 지도원칙으로 짝지은 것은?", "options": ["경제성 · 생산성", "공공성 · 수익성", "보속성 · 합자연성", "생산성 · 환경보전"], "answer": 1, "explain": "공공성·수익성이 최고 지도원칙", "ref": "모듈 p.4–5"}, {"id": "산림경영-2", "subject": "산림경영", "num": 2, "part": 1, "stem": "토지순수익 최대 벌기령에 대한 설명으로 옳은 것은?", "options": ["재적수확 최대 벌기령과 항상 같다", "이율이 높을수록 짧아진다", "생리적 벌기령이라고도 한다", "화폐수익과 관계없이 정해진다"], "answer": 1, "explain": "토지기망가 최대 = 이재적 벌기령, 이율 높으면 짧아짐", "ref": "p.5–7"}, {"id": "산림경영-3", "subject": "산림경영", "num": 3, "part": 1, "stem": "법정림의 요건이 **아닌** 것은?", "options": ["법정영급분배", "법정임분배치", "법정생장량", "법정이율"], "answer": 3, "explain": "4요건 = 영급분배·임분배치·생장량·축적", "ref": "p.7–9"}, {"id": "산림경영-4", "subject": "산림경영", "num": 4, "part": 1, "stem": "면적 100ha, 윤벌기 40년인 작업급에서 벌기 임분의 ha당 재적이 400㎥일 때, 벌기수확법으로 구한 하계 법정축적은?", "options": ["8,000㎥", "16,000㎥", "20,000㎥", "40,000㎥"], "answer": 2, "explain": "Vn = (U/2) × m_u × (F/U) = (40/2) × 400 × (100/40) = 20,000㎥", "ref": "p.7–9"}, {"id": "산림경영-5", "subject": "산림경영", "num": 5, "part": 1, "stem": "현실축적 30,000㎥, 법정축적 25,000㎥, 법정벌채량(법정생장량) 1,000㎥일 때 Hundeshagen법에 따른 표준연벌채량은?", "options": ["1,000㎥", "1,200㎥", "1,400㎥", "1,500㎥"], "answer": 1, "explain": "E = Vw × En/Vn = 30,000 × 1,000/25,000 = 1,200㎥ (En = 법정벌채량)", "ref": "p.11–12"}, {"id": "산림경영-6", "subject": "산림경영", "num": 6, "part": 1, "stem": "임업이율의 성격으로 옳지 **않은** 것은?", "options": ["자본이자이다", "평정이율이다", "실질이율이다", "장기이율이다"], "answer": 2, "explain": "실질이율이 아니라 명목이율", "ref": "p.17"}, {"id": "산림경영-7", "subject": "산림경영", "num": 7, "part": 1, "stem": "임지기망가에 대한 설명으로 옳지 **않은** 것은?", "options": ["이율이 높을수록 임지기망가는 작아진다", "이율이 높을수록 최대값에 빨리 도달한다", "조림비가 클수록 최대값에 늦게 도달한다", "관리비가 클수록 최대값에 늦게 도달한다"], "answer": 3, "explain": "관리비는 최대값 도달 시점과 무관", "ref": "p.22–23"}, {"id": "산림경영-8", "subject": "산림경영", "num": 8, "part": 1, "stem": "중령림의 임목평가에 쓰며 이율을 사용하지 않는 방법은?", "options": ["Glaser법", "임목기망가법", "임목비용가법", "시장가역산법"], "answer": 0, "explain": "Glaser법: Am = (Au − C)m²/u² + C, 이율 안 씀", "ref": "p.24–28"}, {"id": "산림경영-9", "subject": "산림경영", "num": 9, "part": 1, "stem": "500만원을 연 5% 복리로 10년 동안 거치했을 때 후가는? (1.05¹⁰ ≈ 1.6289)", "options": ["약 750만원", "약 814만원", "약 863만원", "1,000만원"], "answer": 1, "explain": "500 × 1.6289 ≈ 814.4만원", "ref": "p.17–18"}, {"id": "산림경영-10", "subject": "산림경영", "num": 10, "part": 1, "stem": "매년 말 30만원의 순수익이 영구히 발생하는 산림의 전가는? (이율 6%)", "options": ["180만원", "300만원", "450만원", "500만원"], "answer": 3, "explain": "무한연년이자 전가 = r/P = 30/0.06 = 500만원", "ref": "p.17–18"}, {"id": "산림경영-11", "subject": "산림경영", "num": 11, "part": 1, "stem": "시장가역산법으로 원목 1㎥당 임목가를 구하면? (이용률 80%, 원목 시장가 150,000원/㎥, 벌채·운반 등 생산비 30,000원/㎥, 월이율 2%, 자본회수기간 5개월, 기업이익률은 고려하지 않음)", "options": ["약 72,000원", "약 85,090원", "약 96,000원", "120,000원"], "answer": 1, "explain": "x = 0.8 × [150,000/(1 + 5 × 0.02) − 30,000] = 0.8 × (136,364 − 30,000) ≈ 85,091원", "ref": "p.27–28"}, {"id": "산림경영-12", "subject": "산림경영", "num": 12, "part": 1, "stem": "취득원가 2,000만원, 잔존가치 200만원, 내용연수 10년인 장비의 정액법 연간 감가상각비는?", "options": ["100만원", "150만원", "180만원", "200만원"], "answer": 2, "explain": "(2,000 − 200)/10 = 180만원", "ref": "p.29–31"}, {"id": "산림경영-13", "subject": "산림경영", "num": 13, "part": 1, "stem": "내용연수 5년인 장비를 연수합계법으로 상각할 때 1년차 상각률은?", "options": ["1/5", "5/15", "4/15", "5/10"], "answer": 1, "explain": "분모 1+2+3+4+5 = 15, 1년차 5/15", "ref": "p.29–31"}, {"id": "산림경영-14", "subject": "산림경영", "num": 14, "part": 1, "stem": "제재목 판매단가 40,000원/㎥, 변동비 25,000원/㎥, 고정비 300만원일 때 손익분기 판매량은?", "options": ["120㎥", "150㎥", "200㎥", "300㎥"], "answer": 2, "explain": "300만/(40,000 − 25,000) = 200㎥", "ref": "p.34–36"}, {"id": "산림경영-15", "subject": "산림경영", "num": 15, "part": 1, "stem": "10년 전 재적 200㎥, 현재 재적 300㎥인 임분의 Pressler 생장률은?", "options": ["3%", "4%", "5%", "6%"], "answer": 1, "explain": "(300 − 200)/(300 + 200) × 200/10 = 0.2 × 20 = 4%", "ref": "p.94–96"}, {"id": "산림경영-16", "subject": "산림경영", "num": 16, "part": 1, "stem": "투자분석 판단 기준으로 옳지 **않은** 것은?", "options": ["NPV가 0보다 크면 투자한다", "B/C비가 1보다 크면 투자한다", "NPV는 절대치라서 투자규모가 다른 사업끼리 비교하기 어렵다", "IRR이 시장이자율보다 작으면 투자한다"], "answer": 3, "explain": "IRR이 시장이자율보다 커야 투자", "ref": "p.36–39"}, {"id": "산림경영-17", "subject": "산림경영", "num": 17, "part": 1, "stem": "산림기본계획의 수립 주기는? (2017년 이후)", "options": ["5년", "10년", "15년", "20년"], "answer": 3, "explain": "산림기본계획·지역산림계획 20년", "ref": "p.40–43"}, {"id": "산림경영-18", "subject": "산림경영", "num": 18, "part": 1, "stem": "산림경영계획 인가에 따른 혜택으로 옳지 **않은** 것은?", "options": ["벌채할 때 허가 대신 사전신고로 할 수 있다", "인가 후 5년 이상 경영한 보전산지를 양도하면 양도소득세를 감면받는다", "5년 이상 조림한 보전산지는 상속세 계산 때 30억원 한도로 재산가액을 공제받는다", "5년 이상 조림한 29.7ha 이내 산림지를 영농자녀에게 증여하면 증여세를 100% 감면받는다"], "answer": 1, "explain": "양도소득세 감면은 인가 후 10년 이상 경영", "ref": "p 해 산림청장이 수립하는 기본계획의 주기는?", "options": ["5년마다", "10년마다", "15년마다", "20년마다"], "answer": 1, "explain": "도시숲·생활숲 조성·관리 기본계획은 산림청장이 10년마다 수립", "ref": "도시숲법"}, {"id": "산림관계법규-69", "subject": "산림관계법규", "num": 69, "part": 4, "stem": "「탄소흡수원 유지 및 증진에 관한 법률」상 산림의 온실가스 감축 효과를 인증받는 산림탄소흡수량의 거래 단위는?", "options": ["1kg CO₂eq", "1t CO₂eq", "10t CO₂eq", "100t CO₂eq"], "answer": 1, "explain": "산림탄소흡수량의 기본 인증 단위는 1t CO₂eq (이산화탄소 상당량 톤)", "ref": "탄소흡수원법"}, {"id": "산림관계법규-70", "subject": "산림관계법규", "num": 70, "part": 4, "stem": "「산림자원의 조성 및 관리에 관한 법률」상 채종림 또는 채종원으로 지정·고시된 산림 구역에서의 제한 행위로 옳은 것은?", "options": ["산림청장의 허가 없이 임목을 벌채하거나 종자를 채취하는 행위 금지", "공인된 학술 연구 목적의 진입도 절대 금지", "가축의 방목은 연중 언제나 자유롭게 허용", "잡초 제거 및 풀베기 작업 전면 금지"], "answer": 0, "explain": "채종림·채종원에서는 우량 종자 보존을 위해 무단 입목 벌채 및 임의 종자 채취가 엄격히 금지됨", "ref": "산림자원법"}, {"id": "산림관계법규-71", "subject": "산림관계법규", "num": 71, "part": 4, "stem": "「산지관리법」상 산지전용허가를 받지 않고 일정 기간 동안 임시로 산지를 사용한 후 원상복구하는 산지일시사용신고의 대상 행위는?", "options": ["아파트 단지 신축", "산림경영관리사(연면적 50㎡ 이하) 설치 및 임도·작업로 개설", "대규모 골프장 건설", "산업단지 공장 설립"], "answer": 1, "explain": "산림경영을 위한 50㎡ 이하의 관리사, 임도, 작업로, 임산물 건조장 등은 산지일시사용신고 대상으로 허가보다 절차가 간소합니다.", "ref": "산지관리법"}, {"id": "산림관계법규-72", "subject": "산림관계법규", "num": 72, "part": 4, "stem": "「임업 및 산촌 진흥 촉진에 관한 법률」상 임업의 생산성을 높이고 임업을 집약적으로 경영하기 위해 산림을 지정·고시하는 구역은?", "options": ["임업진흥권역", "자연휴양림구역", "산지전용제한지역", "도시계획구역"], "answer": 0, "explain": "관할 시·도지사는 임업의 집약적 육성을 위해 보전산지 등을 대상으로 임업진흥권역을 지정합니다.", "ref": "임업진흥법"}, {"id": "산림관계법규-73", "subject": "산림관계법규", "num": 73, "part": 4, "stem": "「산림복지 진흥에 관한 법률」상 경제적·사회적 여건 등으로 산림복지 혜택을 받기 어려운 소외계층에게 자연휴양림이나 치유의 숲을 이용할 수 있도록 제공하는 바우처의 공식 명칭은?", "options": ["산림복지서비스이용권", "국민행복카드", "녹색성장카드", "산림치유바우처"], "answer": 0, "explain": "산림복지이용권(바우처)은 취약계층의 산림휴양·치유 시설 이용을 국가가 지원하는 복지 제도입니다.", "ref": "산림복지법"}, {"id": "산림관계법규-74", "subject": "산림관계법규", "num": 74, "part": 4, "stem": "「백두대간 보호에 관한 법률」상 백두대간 보호지역의 완충구역에서 지자체장의 허가를 받아 제한적으로 설치할 수 있는 공익시설은?", "options": ["농림어업인의 주택 신축 및 부대시설", "대규모 위락시설", "카지노 및 경마장", "대형 아웃 안사방에서 퇴사울(퇴사울타리)을 세우는 주된 목적은?", "options": ["해수 담수화", "방풍림을 벌채하기 위해", "날리는 모래를 퇴적시켜 사구(전사구)를 조성", "해안도로 배수"], "answer": 2, "explain": "퇴사울세우기로 모래를 쌓아 전사구 조성 → 이후 사초 심기·정사울 등", "ref": "사방공학"}, {"id": "산림토목-51", "subject": "산림토목", "num": 51, "part": 4, "stem": "산악지형에서 임도망을 배치할 때 능선을 따라 개설하는 능선임도(Ridge road)의 장점으로 옳은 것은?", "options": ["배수 처리가 용이하고 교량이나 암거 등 구조물 공사비가 적게 든다", "산 아래 골짜기의 집재 거리가 매우 짧아진다", "노폭을 넓히기 쉽고 곡선반경 확보가 항상 유리하다", "토공량이 사면임도에 비해 월등히 많이 든다"], "answer": 0, "explain": "능선임도는 계곡임도에 비해 집수면적이 작아 배수가 쉽고 암거·교량 등 배수구조물 공사비 절감", "ref": "임도공학"}, {"id": "산림토목-52", "subject": "산림토목", "num": 52, "part": 4, "stem": "임도 설계 시 자동차가 직선부에서 원곡선부로 진입할 때 원심력의 급격한 변화를 완화시켜 안전성을 높이기 위해 설치하는 완화곡선의 대표적인 곡선은?", "options": ["포물선", "클로소이드(Clothoid) 곡선", "쌍곡선", "타원곡선"], "answer": 1, "explain": "직선과 원곡선 사이에 완화구간으로 반경이 연속적으로 변하는 클로소이드(Clothoid) 곡선 적용", "ref": "임도설계학"}, {"id": "산림토목-53", "subject": "산림토목", "num": 53, "part": 4, "stem": "임도 노면 아래에 매설하는 횡단배수관의 파손을 방지하기 위한 최소 토피(흙덮기 두께) 기준은?", "options": ["20cm 이상", "30cm 이상", "50cm 이상", "100cm 이상"], "answer": 2, "explain": "횡단배수관은 트럭 바퀴 하중에 의한 파손 방지를 위해 최소 토피 50cm 이상 확보 필수", "ref": "임도시공규정"}, {"id": "산림토목-54", "subject": "산림토목", "num": 54, "part": 4, "stem": "임도의 종단기울기가 급변하는 변곡점에 주행 충격을 완화하기 위해 설치하는 종단곡선(Vertical curve)에 주로 적용되는 곡선은?", "options": ["단심원곡선", "2차 포물선", "클로소이드", "반향곡선"], "answer": 1, "explain": "종단곡선은 경사 변화에 따른 충격을 완화하기 위해 2차 포물선(Parabola) 적용", "ref": "도로공학"}, {"id": "산림토목-55", "subject": "산림토목", "num": 55, "part": 4, "stem": "흙깎기(절토) 비탈면에서 지하수 침투로 인해 원호 모양의 미끄럼면을 따라 사면 전체가 대규모로 쓸려 내려가는 붕괴 형태는?", "options": ["표주 붕괴", "원호 슬라이딩(Rotational slide)", "쐐기 파괴", "낙석"], "answer": 1, "explain": "점착력이 있는 점토질 비탈면이 지하수로 포화되어 원호면을 따라 미끄러지는 현상은 원호 슬라이딩", "ref": "사면안정학"}, {"id": "산림토목-56", "subject": "산림토목", "num": 56, "part": 4, "stem": "성토 구간에서 점성토(진흙질 흙)의 다짐에 가장 효과적인 토공 다짐 장비는?", "options": ["마카담 롤러", "탠덤 롤러", "탬핑 롤러(Sheepsfoot roller)", "진동 콤팩터"], "answer": 2, "explain": "탬핑 롤러(Sheepsfoot roller)는 돌기형 바퀴로 점성토의 깊은 층까지 전압하는 데 최적", "ref": "토공기계학"}, {"id": "산림토목-57", "subject": "산림토목", "num": 57, "part": 4, "stem": "가선집재 장치 중 작업선(스카이라인)에 통나무를 매달고 양방향으로 윈치를 당겨 평지 및 완경사지에서 목재를 끌어모으는 연속식 집재 방식은?", "options": ["중력식 가선집재", "타일러(Tyler) 방식", "엔드리스 타일러(Endless Tyler) 방식", "러닝 스카이라인"], "answer": 2, "explain": "엔드리스 타일러는 순환 와이어로프를 이용해 평지나 완경사지에서 전후 양방향 견인이 가능한 방식", "ref": "가선집재학"}, {"id": "산림토목-58", "subject": "산림토목", "num": 58, "part": 4, "stem": "동력사슬톱(체인소) 작업 시 킥백(Kick-back: 톱날 끝이 튀어 오르는 현상) 발생 시 작업자의 왼손 손등이 밀치면서 체인을 0.1초 내로 멈추게 하는 안전장치는?", "options": ["체인 캐처", "체인 브레이크(핸드가드 연동)", "스로틀 인터록", "방진 스프링"], "answer": 1, "explain": "킥백 시 왼손 손등이 전방 가드를 밀치면서 밴드 브레이크가 작동해 체인이 즉각 정지됨", "ref": "임업기계안전"}, {"id": "산림토목-59", "subject": "산림토목", "num": 59, "part": 4, "stem": "사방댐이 계곡 상류에서 밀려 내려온 토사를 가두어 저사(貯砂) 기능을 수행한 후 최종적으로 안정화되는 계곡 바닥의 기울기를 무엇이라 하는가?", "options": ["원지반 기울기", "평형하상 기울기(퇴사 기울기)", "임계 경사", "수로 구배"], "answer": 1, "explain": "사방댐에 토사가 채워져 침식과 퇴적이 평형을 이루는 바닥 경사를 평형하상 기울기(퇴사기울기)라 함", "ref": "사방공학"}, {"id": "산림토목-60", "subject": "산림토목", "num": 60, "part": 4, "stem": "사방댐의 안정 조건을 계산할 때 댐체를 하류 쪽으로 밀어내거나 넘어뜨리려 하는 주된 외력(작용력)의 조합은?", "options": ["댐 자체 중량 + 기초 마찰력", "정수압 + 동수압(토사 충격력) + 토압", "지반 지지력 + 양압력", "저수량 + 침하력"], "answer": 1, "explain": "사방댐을 전도·활동시키는 외력은 상류의 정수압, 쇄도하는 토석류의 동수압, 퇴사 토압", "ref": "사방구조역학"}, {"id": "산림토목-61", "subject": "산림토목", "num": 61, "part": 4, "stem": "황폐한 계곡 상류의 붕괴지나 계류 지류의 바닥 깎임을 막기 위해 설치하는 공작물로, 사방댐보다 규모가 작고 물받이 공작물을 생략할 수 있는 소규모 횡단 구조물은?", "options": ["골막이", "기슭막이", "수제", "바닥막이"], "answer": 0, "explain": "골막이는 사방댐보다 작은 규모로 계곡 상류 지류에 시공하며 물받이를 생략하는 경우가 많음", "ref": "사방공학"}, {"id": "산림토목-62", "subject": "산림토목", "num": 62, "part": 4, "stem": "계곡의 유속이 빠르고 거센 급류 구역에서 계안(계곡 양 언덕)의 기슭이 침식되어 무너지는 것을 방지하기 위해 계류 흐름과 평행하게 축조하는 공작물은?", "options": ["사방댐", "기슭막이(Revetment)", "골막이", "암거배수로"], "answer": 1, "explain": "기슭막이는 계곡 옆 언덕(계안)의 침식을 방지하기 위해 물길 방향과 나란히 축조하는 공작물", "ref": "계간사방공학"}, {"id": "산림토목-63", "subject": "산림토목", "num": 63, "part": 4, "stem": "산복사방에서 급경사 비탈면을 깎아내어 사면을 완만하게 만든 후 일정한 높이 간격으로 계단 모양의 참을 설치하는 공정은?", "options": ["단끊기(Bench terrace)", "떼심기", "편책공", "비탈다듬기"], "answer": 0, "explain": "비탈다듬기 후 계단 모양의 턱을 만드는 공정을 단끊기(Bench terrace)라 함", "ref": "산복사방공학"}, {"id": "산림토목-64", "subject": "산림토목", "num": 64, "part": 4, "stem": "돌쌓기 공법 중 돌과 돌 사이에 시멘트 모르타르를 채워 넣어 수밀성과 일체 강도를 극대화하는 돌쌓기 방식은?", "options": ["메쌓기(Dry masonry)", "찰쌓기(Wet masonry)", "잡석쌓기", "야면석쌓기"], "answer": 1, "explain": "모르타르를 사용하여 일체화하는 것은 찰쌓기(Wet masonry), 물빠짐을 고려해 돌만 쌓는 것은 메쌓기", "ref": "토목시공학"}, {"id": "산림토목-65", "subject": "산림토목", "num": 65, "part": 4, "stem": "비탈면 녹화 공법 중 흙이 척박하거나 급경사인 비탈면에 흙, 부엽토, 풀씨, 비료를 넣은 자루를 계단 모양으로 쌓아 비탈 안정을 도모하는 공법은?", "options": ["떼붙임공법", "식생자루(새주머니) 공법", "종자뿜어붙이기", "짚덮기"], "answer": 1, "explain": "새주머니(식생자루) 공법은 흙자루에 종자를 넣어 급경사지에 계단식으로 축조하는 녹화공법", "ref": "사면녹화학"}, {"id": "산림토목-66", "subject": "산림토목", "num": 66, "part": 4, "stem": "해안사방에서 해변 모래밭의 모래가 강풍에 날려 내륙으로 이동하는 것을 막고 모래언덕(사구)의 높이를 높여 고정하기 위해 설치하는 격자형 모래방패 울타리는?", "options": ["퇴사울타리(정사울타리)", "방조제", "방파제", "침사지"], "answer": 0, "explain": "해안사구의 모래 이동을 막고 퇴적을 유도하는 시설은 퇴사울타리(정사울타리)", "ref": "해안사방학"}, {"id": "산림토목-67", "subject": "산림토목", "num": 67, "part": 4, "stem": "집중호우 시 상류 붕괴지에서 쏟아진 흙, 거대한 바위, 부러진 통나무가 빗물과 한 덩어리가 되어 맹렬한 속도로 계곡을 따라 쓸고 내려오는 자연재해 현상은?", "options": ["토석류(Debris flow)", "땅밀림", "지반침하", "동결융해"], "answer": 0, "explain": "물과 토사, 암석, 유목이 일체화되어 계곡을 고속으로 질주하는 현상은 토석류(Debris flow)", "ref": "산사태방재학"}, {"id": "산림토목-68", "subject": "산림토목", "num": 68, "part": 4, "stem": "사방댐 본체 중앙에 강재 격자형 빔(Slit)을 설치하여 평상시에는 물과 잔모래를 자연 방류하고, 산사태 발생 시에만 거목과 큰 암석을 선별 차단하는 친환경 사방댐은?", "options": ["콘크리트 중력식 사방댐", "슬릿(Slit) 사방댐(투과형 사방댐)", "석재 사방댐", "흙사방댐"], "answer": 1, "explain": "투과형 슬릿(Slit) 사방댐은 평상시 생태계 단절을 막고 토석류 발생 시 거목과 암석을 차단", "ref": "사방공학"}, {"id": "산림토목-69", "subject": "산림토목", "num": 69, "part": 4, "stem": "임도의 횡단면도 작성 시 표준적인 축척은?", "options": ["1:100", "1:500", "1:1,000", "1:5,000"], "answer": 0, "explain": "임도 횡단면도는 상세한 단면 확인을 위해 1:100 축척으로 제도", "ref": "임도측량학"}, {"id": "산림토목-70", "subject": "산림토목", "num": 70, "part": 4, "stem": "산사태취약지역에 대한 실태조사를 실시해야 하는 주기는?", "options": ["6개월마다", "매년 1회 이상", "3년마다", "5년마다"], "answer": 1, "explain": "산림보호법상 산사태취약지역에 대한 실태조사는 매년 1회 이상 의무적으로 실시", "ref": "산림보호법"}, {"id": "산림토목-71", "subject": "산림토목", "num": 71, "part": 4, "stem": "임도 노면 배수를 위한 횡단배수관의 유입구와 유출구에서 빗물에 의한 비탈면 세굴을 막고 물길을 모아주기 위해 배수관 양옆에 설치하는 콘크리트 구조물은?", "options": ["날개벽(Wing wall)", "소단", "길어깨", "방호책"], "answer": 0, "explain": "배수관 양옆에 'V'자나 사다리꼴로 날개벽을 달아주어야 빗물이 배수관 바깥으로 새어 비탈면을 깎아먹지 않습니다.", "ref": "임도시공학"}, {"id": "산림토목-72", "subject": "산림토목", "num": 72, "part": 4, "stem": "사방댐 여수토(방수로)에서 홍수 시 통과하는 최대 유출량($)을 수리학적으로 계산할 때 사용하는 표준적인 사다리꼴 위어(Weir) 공식 형태는?", "options": ["= C \\cdot B \\cdot H^{3/2}$", "= A \\cdot V^2$", "= C \\cdot I \\cdot A$", "= 2gH$"], "answer": 0, "explain": "위어(Weir) 공식: 유출량은 수로 폭($)과 수심의 1.5승(^{3/2}$)에 유량계수($)를 곱하여 산출합니다.", "ref": "수리학 및 사방공학"}, {"id": "산림토목-73", "subject": "산림토목", "num": 73, "part": 4, "stem": "절토 비탈면의 암반에 균열이 심하여 대규모 암반 붕괴가 우려될 때 사면 깊숙이 강철 인장재를 천공 삽입하고 시멘트 밀크로 그라우팅하여 인장력을 가하는 공법은?", "options": ["그라운드 앵커(Ground anchor) 공법", "떼심기공법", "비탈덮기공법", "파종공"], "answer": 0, "explain": "영구 그라운드 앵커는 깊은 암반까지 쇠줄을 박아 프리스트레스를 주어 사면을 강하게 압착 고정합니다.", "ref": "사면안정공학"}, {"id": "산림토목-74", "subject": "산림토목", "num": 74, "part": 4, "stem": "가선집재 시 무거운 통나무를 공중에 지탱하는 주 와이어로프(주삭, Skyline)의 안전율(파단하중 ÷ 최대장력) 기준으로 옳은 것은?", "options": ["1.0 이상", "1.5 이상", "2.7 이상", "10 이상"], "answer": 2, "explain": "집재기계 안전기준상 주삭(스카이라인)은 안전율 2.7 이상, 예인삭 및 작업선은 안전율 4 이상을 확보해야 합니다.", "ref": "임업기계학"}, {"id": "산림토목-75", "subject": "산림토목", "num": 75, "part": 4, "stem": "지하수위가 높아 붕괴 위험이 있는 절토 비탈면 내부에 구멍을 뚫고 타공 PVC 유공관을 수평으로 삽입하여 물을 빼내는 배수 시설은?", "options": ["수평배수공(Subsurface horizontal drain)", "산마루측구", "종단측구", "집수정"], "answer": 0, "explain": "사면 속의 물을 직접 빼내어 간극수압을 낮추는 시설을 수평배수공(수평 유공관)이라 합니다.", "ref": "사면배수공학"}, {"id": "산림토목-76", "subject": "산림토목", "num": 76, "part": 4, "stem": "임도 노선 측량 시 능선이나 계곡을 따라 주어진 종단경사(예: 8%)를 유지하면서 지표면과 만나는 점들을 연결한 계획 가상선은?", "options": ["영선(Zero line)", "중심선", "지적선", "등고 explain": "섬유포화점(FSP)은 자유수=0%, 결합수 포화 상태(함수율 약 28~30%)를 가리킴", "ref": "목재물리학"}, {"id": "임산가공-52", "subject": "임산가공", "num": 52, "part": 4, "stem": "섬유포화점(약 28~30%) 이하로 목재가 건조될 때 일어나는 수축률의 크기 순서로 옳은 것은?", "options": ["접선방향 > 방사방향 > 섬유방향(축방향)", "섬유방향 > 방사방향 > 접선방향", "방사방향 > 접선방향 > 섬유방향", "접선방향 > 섬유방향 > 방사방향"], "answer": 0, "explain": "목재의 건조 수축률은 접선(연륜 접선)방향 > 방사(나이테 직각)방향 > 섬유(축)방향 (대략 10:5:1)", "ref": "목재물리학"}, {"id": "임산가공-53", "subject": "임산가공", "num": 53, "part": 4, "stem": "목재를 인공건조할 때 건조 초기 표면이 급격히 말라 늘어난 상태로 굳어지고, 내부가 뒤늦게 건조되면서 내부 인장 응력에 의해 발생하는 결함은?", "options": ["찌그러짐(Collapse)", "표면경화(Case hardening)", "청변", "틀어짐"], "answer": 1, "explain": "표면이 먼저 마르고 내부가 뒤늦게 마르면서 잔류 응력이 생겨 굳어지는 결함을 표면경화라 함", "ref": "목재건조학"}, {"id": "임산가공-54", "subject": "임산가공", "num": 54, "part": 4, "stem": "목재 방부제 중 과거 널리 사용되던 비소·크롬계(CCA)의 유해성을 개선하여 현대에 널리 쓰이는 구리·알킬암모늄계 친환경 방부제는?", "options": ["크레오소트유", "ACQ(구리·알킬암모늄 화합물)", "PCP", "볼덴염"], "answer": 1, "explain": "ACQ(Alkaline Copper Quaternary)는 인체 유해 중금속(비소, 크롬)을 배제한 대표 방부제", "ref": "목재보존학"}, {"id": "임산가공-55", "subject": "임산가공", "num": 55, "part": 4, "stem": "원목을 얇은 단판(Veneer)으로 회전 절삭한 후, 인접한 단판의 섬유 방향이 서로 직교하도록 홀수 겹으로 겹쳐 접착한 목질 판상 재료는?", "options": ["파티클보드(PB)", "합판(Plywood)", "중밀도섬유판(MDF)", "지향성스트랜드보드(OSB)"], "answer": 1, "explain": "베니어를 홀수 매로 직교 적층하여 접착한 목질 판상 제품은 합판(Plywood)", "ref": "목재가공학"}, {"id": "임산가공-56", "subject": "임산가공", "num": 56, "part": 4, "stem": "목질 접착제 중 내수성과 내열성이 가장 우수하여 실외용 방수 합판이나 구조용 집성재 제조에 필수적으로 사용되는 접착제는?", "options": ["요소수지 접착제", "페놀수지 접착제", "초산비닐수지 접착제", "녹말풀"], "answer": 1, "explain": "페놀수지(PF) 및 레조르시놀수지 접착제는 내수·내후성이 탁월하여 외장구조용으로 사용", "ref": "목재접착학"}, {"id": "임산가공-57", "subject": "임산가공", "num": 57, "part": 4, "stem": "제지용 펄프 제조법 중 목재 칩을 수산화나트륨(NaOH)과 황화나트륨(Na₂S) 용액으로 증해하여 강도가 매우 강한 포장용 크라프트지를 생산하는 화학펄프는?", "options": ["쇄목펄프(GP)", "크라프트펄프(KP, 황산염펄프)", "아황산펄프(SP)", "반화학펄프(SCP)"], "answer": 1, "explain": "크라프트펄프(KP)는 황화소다 증해로 리그닌을 제거하며 섬유 손상이 적어 강도가 최고", "ref": "펄프제지학"}, {"id": "임산가공-58", "subject": "임산가공", "num function recordAnswers(list) {
  const w = wrongSet();
  list.forEach(({ q, picked }) => { if (picked === q.answer) w.delete(q.id); else w.add(q.id); });
  saveWrong(w);
}

/* ---------- 홈 ---------- */
function home() {
  clearInterval(timerId);
  state = null;
  app.replaceChildren();
  const total = DATA.reduce((n, s) => n + s.questions.length, 0);
  app.append(
    h("h1", {}, "산림경영지도원 필기 모의고사"),
    h("p", { class: "sub" }, `2026 학습모듈 기반 예상문제 ${total}문항 · 기출 아님 · 과목별 40% 과락, 전체 60% 기준으로 채점`),
  );

  const elective = DATA.filter(s => s.kind === "선택");
  const examCard = h("div", { class: "card" },
    h("h2", {}, "실전 모의고사"),
    h("p", { class: "muted" }, `필수 4과목 + 선택 1과목, 과목당 ${PER_SUBJECT}문항 · 100문항 · ${EXAM_MIN}분`),
    h("div", { class: "row" }, ...elective.map((s, i) =>
      h("label", { class: "chip" }, h("input", { type: "radio", name: "elective", value: s.name, checked: i === 0 }), s.name))),
    h("div", { class: "row", style: "margin-top:10px" },
      h("label", { class: "chip" }, h("input", { type: "radio", name: "pool", value: "mix", checked: true }), "전체에서 무작위"),
      h("label", { class: "chip" }, h("input", { type: "radio", name: "pool", value: "1" }), "기본 1~20번 고정")),
    h("div", { style: "margin-top:14px" }, h("button", { class: "primary", onclick: startExam }, "시작")),
  );

  const practiceCard = h("div", { class: "card" },
    h("h2", {}, "과목별 연습"),
    h("p", { class: "muted" }, "한 문제씩 풀고 바로 정답과 해설 확인"),
    h("div", { class: "row" },
      h("select", { id: "pSubject" }, ...DATA.map(s => h("option", { value: s.name }, `${s.name} (${s.kind})`))),
      h("select", { id: "pPart" },
        h("option", { value: "0" }, "전체 파트"), h("option", { value: "1" }, "Part 1 기본"),
        h("option", { value: "2" }, "Part 2 심화"), h("option", { value: "3" }, "Part 3 참고자료"), h("option", { value: "4" }, "Part 4 산림기사 기출")),
      h("label", { class: "chip" }, h("input", { type: "checkbox", id: "pShuffle", checked: true }), "섞기")),
    h("div", { style: "margin-top:14px" }, h("button", { class: "primary", onclick: startPractice }, "시작")),
  );

  const w = wrongSet();
  const wrongCard = h("div", { class: "card" },
    h("h2", {}, "오답노트"),
    h("p", { class: "muted" }, `저장된 오답 ${w.size}문항 · 맞히면 목록에서 빠집니다`),
    h("div", { class: "row" },
      h("button", { class: "primary", disabled: w.size === 0, onclick: () => startWrong() }, "오답 다시 풀기"),
      h("button", { disabled: w.size === 0, onclick: () => { if (confirm("오답노트를 비울까요?")) { saveWrong(new Set()); home(); } } }, "비우기")),
  );

  app.append(h("div", { class: "grid" }, examCard, practiceCard), wrongCard);

  const hist = store.get("history", []);
  if (hist.length) {
    app.append(h("div", { class: "card" }, h("h2", {}, "최근 모의고사 기록"),
      h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "날짜"), h("th", {}, "선택"), h("th", {}, "점수"), h("th", {}, "판정"))),
        h("tbody", {}, ...hist.slice(-8).reverse().map(r => h("tr", {},
          h("td", {}, r.date), h("td", {}, r.elective), h("td", {}, `${r.avg.toFixed(1)}점`),
          h("td", {}, h("span", { class: "pill " + (r.pass ? "ok" : "no") }, r.pass ? "통과" : r.fail || "미달"))))))));
  }
}

/* ---------- 실전 ---------- */
function startExam() {
  const elective = document.querySelector("input[name=elective]:checked").value;
  const pool = document.querySelector("input[name=pool]:checked").value;
  const subjects = DATA.filter(s => s.kind === "필수" || s.name === elective);
  const sections = subjects.map(s => {
    const qs = pool === "1" ? s.questions.filter(q => q.part === 1) : shuffle(s.questions).slice(0, PER_SUBJECT).sort((a, b) => a.num - b.num);
    return { name: s.name, qs };
  });
  state = { mode: "exam", elective, sections, picks: {}, tab: 0, deadline: Date.now() + EXAM_MIN * 60000 };
  renderExam();
  timerId = setInterval(tick, 1000);
}
function tick() {
  const el = document.getElementById("timer");
  if (!el || !state) return;
  const left = Math.max(0, state.deadline - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  el.textContent = `${String(m).padStart(3, " ")}:${String(s).padStart(2, "0")}`;
  el.classList.toggle("low", left < 10 * 60000);
  if (left === 0) { clearInterval(timerId); alert("시험 시간이 끝났습니다. 자동 채점합니다."); gradeExam(); }
}
function renderExam() {
  app.replaceChildren();
  const answered = Object.keys(state.picks).length;
  const totalQ = state.sections.reduce((n, s) => n + s.qs.length, 0);
  app.append(h("div", { class: "topbar" }, h("div", { class: "inner" },
    h("div", {}, h("span", { class: "timer", id: "timer" }, ""), h("span", { class: "muted", style: "margin-left:10px" }, `${answered}/${totalQ} 표기`)),
    h("div", { class: "row" },
      h("button", { onclick: () => { if (confirm("시험을 그만두고 처음으로 갈까요?")) home(); } }, "나가기"),
      h("button", { class: "primary", onclick: () => { if (answered < totalQ && !confirm(`${totalQ - answered}문항이 비어 있습니다. 제출할까요?`)) return; gradeExam(); } }, "제출")))));

  app.append(h("div", { class: "tabs" }, ...state.sections.map((s, i) => {
    const done = s.qs.filter(q => q.id in state.picks).length;
    return h("button", { class: i === state.tab ? "on" : "", onclick: () => { state.tab = i; renderExam(); window.scrollTo(0, 0); } }, `${s.name} ${done}/${s.qs.length}`);
  })));

  const sec = state.sections[state.tab];
  const omr = h("div", { class: "omr" }, ...sec.qs.map((q, i) =>
    h("button", { class: q.id in state.picks ? "done" : "", onclick: () => document.getElementById("q-" + q.id).scrollIntoView({ behavior: "smooth", block: "center" }) },
      `${i + 1}${q.id in state.picks ? " " + MARKS[state.picks[q.id]] : ""}`)));
  app.append(h("div", { class: "card" }, h("div", { class: "muted" }, "답안 표기 현황"), omr));

  app.append(h("div", { class: "card" }, ...sec.qs.map((q, i) => h("div", { class: "q", id: "q-" + q.id },
    h("div", { class: "stem" }, `${i + 1}. ${q.stem}`, h("span", { class: "tag" }, `${partLabel(q.part)} #${q.num}`)),
    ...q.options.map((o, k) => h("button", { class: "opt" + (state.picks[q.id] === k ? " sel" : ""),
      onclick: () => { state.picks[q.id] = k; const y = window.scrollY; renderExam(); window.scrollTo(0, y); } }, `${MARKS[k]} ${o}`))))));

  const nav = h("div", { class: "row" });
  if (state.tab > 0) nav.append(h("button", { onclick: () => { state.tab--; renderExam(); window.scrollTo(0, 0); } }, "← 이전 과목"));
  if (state.tab < state.sections.length - 1) nav.append(h("button", { class: "primary", onclick: () => { state.tab++; renderExam(); window.scrollTo(0, 0); } }, "다음 과목 →"));
  app.append(nav);
  tick();
}
function gradeExam() {
  clearInterval(timerId);
  const rows = state.sections.map(s => {
    const right = s.qs.filter(q => state.picks[q.id] === q.answer).length;
    return { name: s.name, right, n: s.qs.length, score: right / s.qs.length * 100 };
  });
  const avg = rows.reduce((a, r) => a + r.score, 0) / rows.length;
  const cut = rows.filter(r => r.score < 40);
  const pass = cut.length === 0 && avg >= 60;
  recordAnswers(state.sections.flatMap(s => s.qs.map(q => ({ q, picked: state.picks[q.id] }))));
  const hist = store.get("history", []);
  hist.push({ date: new Date().toLocaleDateString("ko-KR"), elective: state.elective, avg, pass,
    fail: cut.length ? `과락 ${cut.map(r => r.name).join("·")}` : avg < 60 ? "평균 미달" : "" });
  store.set("history", hist.slice(-30));
  state.result = { rows, avg, pass, cut };
  state.mode = "review";
  renderResult(false);
}
function renderResult(onlyWrong) {
  app.replaceChildren();
  const { rows, avg, pass, cut } = state.result;
  app.append(h("h1", {}, "채점 결과"),
    h("div", { class: "card" },
      h("div", { class: "row", style: "justify-content:space-between" },
        h("div", {}, h("div", { class: "muted" }, "평균(가산점 제외)"), h("div", { class: "big" }, `${avg.toFixed(1)}점`)),
        h("span", { class: "pill " + (pass ? "ok" : "no"), style: "font-size:1rem;padding:6px 14px" },
          pass ? "기준 통과" : cut.length ? `과락: ${cut.map(r => r.name).join(", ")}` : "평균 60점 미달")),
      h("p", { class: "muted" }, "실제 합격은 지역별 고득점순(선발인원 130%)이라 기준 통과만으로 합격이 보장되지는 않습니다. 목표는 평균 70점 이상."),
      h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "과목"), h("th", {}, "정답"), h("th", {}, "점수"), h("th", {}, ""))),
        h("tbody", {}, ...rows.map(r => h("tr", {}, h("td", {}, r.name), h("td", {}, `${r.right}/${r.n}`),
          h("td", { style: "min-width:140px" }, h("div", {}, `${r.score.toFixed(0)}점`), h("div", { class: "bar" }, h("span", { style: `width:${r.score}%` }))),
          h("td", {}, h("span", { class: "pill " + (r.score < 40 ? "no" : r.score < 60 ? "warn" : "ok") }, r.score < 40 ? "과락" : r.score < 60 ? "보강" : "양호"))))))),
    h("div", { class: "row", style: "margin-bottom:16px" },
      h("button", { class: onlyWrong ? "" : "primary", onclick: () => renderResult(false) }, "전체 해설"),
      h("button", { class: onlyWrong ? "primary" : "", onclick: () => renderResult(true) }, "틀린 문제만"),
      h("button", { onclick: home }, "처음으로")));
  state.sections.forEach(s => {
    const qs = s.qs.filter(q => !onlyWrong || state.picks[q.id] !== q.answer);
    if (!qs.length) return;
    app.append(h("div", { class: "card" }, h("h2", {}, s.name), ...qs.map(q => reviewBlock(q, state.picks[q.id]))));
  });
  window.scrollTo(0, 0);
}
function reviewBlock(q, picked) {
  return h("div", { class: "q" },
    h("div", { class: "stem" }, `${q.subject} #${q.num}. ${q.stem}`, h("span", { class: "tag" }, partLabel(q.part))),
    ...q.options.map((o, k) => h("div", { class: "opt" + (k === q.answer ? " right" : k === picked ? " wrong" : "") }, `${MARKS[k]} ${o}`)),
    h("div", { class: "explain" }, h("strong", {}, `정답 ${MARKS[q.answer]}`), picked == null ? " · 미표기" : picked === q.answer ? " · 맞음" : ` · 내 답 ${MARKS[picked]}`,
      h("div", {}, q.explain), h("div", { class: "muted" }, `근거: ${q.ref}`)));
}

/* ---------- 연습 / 오답 ---------- */
function startPractice() {
  const name = document.getElementById("pSubject").value;
  const part = +document.getElementById("pPart").value;
  let qs = DATA.find(s => s.name === name).questions.filter(q => !part || q.part === part);
  if (document.getElementById("pShuffle").checked) qs = shuffle(qs);
  runDrill(qs, `${name}${part ? " · Part " + part : ""}`);
}
function startWrong() {
  const qs = shuffle([...wrongSet()].map(id => byId[id]).filter(Boolean));
  runDrill(qs, "오답노트");
}
function runDrill(qs, title) {
  clearInterval(timerId);
  state = { mode: "drill", qs, i: 0, right: 0, title };
  renderDrill(null);
}
function renderDrill(picked) {
  app.replaceChildren();
  const { qs, i, title } = state;
  if (i >= qs.length) {
    app.append(h("h1", {}, `${title} 완료`),
      h("div", { class: "card" }, h("div", { class: "big" }, `${state.right}/${qs.length}`),
        h("p", { class: "muted" }, "틀린 문제는 오답노트에 저장됐습니다."),
        h("div", { class: "row" }, h("button", { class: "primary", onclick: home }, "처음으로"))));
    return;
  }
  const q = qs[i];
  app.append(h("div", { class: "topbar" }, h("div", { class: "inner" },
    h("div", {}, h("strong", {}, title), h("span", { class: "muted", style: "margin-left:10px" }, `${i + 1}/${qs.length} · 정답 ${state.right}`)),
    h("button", { onclick: home }, "그만하기"))));
  const card = h("div", { class: "card" });
  if (picked == null) {
    card.append(h("div", { class: "stem", style: "font-weight:600;margin-bottom:10px;white-space:pre-line" },
      `${q.subject} #${q.num}. ${q.stem}`, h("span", { class: "tag muted" }, ` ${partLabel(q.part)}`)),
      ...q.options.map((o, k) => h("button", { class: "opt", onclick: () => {
        if (k === q.answer) state.right++;
        recordAnswers([{ q, picked: k }]);
        renderDrill(k);
      } }, `${MARKS[k]} ${o}`)));
  } else {
    card.append(reviewBlock(q, picked),
      h("div", { style: "margin-top:12px" }, h("button", { class: "primary", onclick: () => { state.i++; renderDrill(null); window.scrollTo(0, 0); } }, i + 1 < qs.length ? "다음 문제" : "결과 보기")));
  }
  app.append(card);
}

home();
</script>
</body>
</html>
